<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_att.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
    crossorigin="anonymous">
    <title>FactoryConnect - Portal de Gestão Industrial</title>
</head>
<body class="bg-white text-dark">
    <main class="container my-5">
        <header class="mb-4">
            <h1 class="fw-bold">FactoryConnect - Portal de Gestão Industrial</h1>
            <p class="mt-3">
                Uma indústria está digitalizando seus processos e contratou a DevSolutions para criar uma interface Web responsiva que centralize informações das principais áreas.
            </p>
        </header>

        <section class="row g-4">
            <article class="col-12 col-md-6 col-lg-4">
                <div class="border rounded p-4 text-center">
                    <span class="border rounded px-3 py-2 d-inline-block">Produção</span>
                </div>
            </article>

            <article class="col-12 col-md-6 col-lg-4">
                <div class="border rounded p-4 text-center">
                    <span class="border rounded px-3 py-2 d-inline-block">Manutenção</span>
                </div>
            </article>

            <article class="col-12 col-md-6 col-lg-4">
                <div class="border rounded p-4 text-center">
                    <span class="border rounded px-3 py-2 d-inline-block">Qualidade</span>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
