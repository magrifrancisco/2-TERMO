
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_rec.css">
    <title>TECHFEST</title>
</head>
<body>

    <header class="cabeçalho">
        <a href="#logo"><h1><span>TECH</span>FEST</h1></a>

        <nav>
            <ul>
                <li><a href="#Início">INÍCIO |</a></li>
                <li><a href="#Atrações">ATRAÇÕES |</a></li>
                <li><a href="#Programaçõo">PROGRAMAÇÃO |</a></li>
                <li><a href="#Sobre">SOBRE</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="conteudo">

            <header class="informacao">
                <h1>TECNOLOGIA QUE TRANSFORMA</h1>
                <p>Descrição de destaque do festival</p>
            </header>

            <article class="conteudo-img">
                <img src="imagens/quarto.png" alt="Imagem ilustrativa">
            </article>

        </section>

            <button class="btn">
            Explorar Atrações
            </button>


        <section class="cards">

            <ul class="cards-img">

                <figure>
                    <li>Card 1</li>
                    <img src="imagens/pc.png" alt="Imagem Gerada por IA">
                </figure>

                <figure>
                    <li>Card 2</li>
                    <img src="imagens/santos.png" alt="Imagem Gerada por IA">
                </figure>

                <figure>
                    <li>Card 3</li>
                    <img src="imagens/programacao.png" alt="Imagem Gerada por IA">
                </figure>

                <figure>
                    <li>Card 4</li>
                    <img src="imagens/fut.png" alt="Imagem Gerada por IA">
                </figure>

                <figure>
                    <li>Card 5</li>
                    <img src="" alt="Imagem Gerada por IA">
                </figure>

                <figure>
                    <li>Card 6</li>
                    <img src="" alt="Imagem Gerada por IA">
                </figure>

            </ul>

        </section>

        <section class="informacoes">

            <article id="Programacao">
                <h2>PROGRAMAÇÃO</h2>
                <p>4 horários</p>
            </article>

            <article id="Sobre">
                <h2>SOBRE</h2>
                <p>Texto do evento</p>
            </article>

        </section>

    </main>

    <footer>
        <p>Rodapé | Contato | Créditos</p>
    </footer>

</body>
</html>
